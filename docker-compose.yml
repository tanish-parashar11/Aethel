version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: anei-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: anei-redis
    ports:
      - "6379:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: anei-keycloak
    command: start-dev --http-port=8080 --db=postgres --db-url=jdbc:postgresql://postgres:5432/${POSTGRES_DB} --db-username=${POSTGRES_USER} --db-password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres

  synapse:
    image: matrixdotorg/synapse:v1.110.0
    container_name: anei-synapse
    ports:
      - "8008:8008"
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME}
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - ./infra/matrix:/data

volumes:
  postgres_data:
